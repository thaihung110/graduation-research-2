apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: transform-crypto-silver
  namespace: default
  labels:
    app: transform-crypto-silver
    component: etl
    layer: silver
spec:
  type: Python
  mode: cluster
  pythonVersion: "3"
  sparkVersion: "3.5.0"

  # Spark image with Python support and application code
  # Build and push using: cd spark-jobs/transform-crypto-silver && ./build-image.sh
  # Image is available at: https://hub.docker.com/r/hungvt0110/transform-crypto-silver
  image: hungvt0110/transform-crypto-silver:latest

  imagePullPolicy: Always

  # Main Python application file (inside the image)
  mainApplicationFile: local:///app/src/main.py

  # Arguments to pass to the Python script
  # Format: <bronze_table> <silver_table> [filter_date]
  # Table format: {catalog}.{namespace}.{table}
  arguments:
    - "bronze.bronze.crypto_trades_raw" # Source Bronze table (catalog.namespace.table)
    - "silver.silver.crypto_trades" # Target Silver table (catalog.namespace.table)
    # Optional: Add date filter for incremental loads
    # - "2025-12-18" # Filter date (YYYY-MM-DD)

  # Spark configuration
  # Note: Most Iceberg/lakekeeper configs are set in Python code (transform_crypto_silver.py)
  # Only set configs here that must be set before SparkSession creation
  sparkConf:
    # JARs packages - must be set before SparkSession creation
    # Includes: Iceberg, Hadoop AWS (no Kafka needed for this job)
    "spark.jars.packages": "org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.5.2,org.apache.iceberg:iceberg-aws-bundle:1.5.2,org.apache.hadoop:hadoop-aws:3.3.4"
    # Ivy cache to /tmp (always writable in pods)
    "spark.jars.ivy": "/tmp/.ivy2"

  # Hadoop configuration for MinIO (S3-compatible)
  hadoopConf:
    "fs.s3a.endpoint": "http://openhouse-minio:9000"
    "fs.s3a.path.style.access": "true"
    "fs.s3a.connection.ssl.enabled": "false"
    "fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "fs.s3a.aws.credentials.provider": "org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider"

  # Driver configuration
  # Reduced resources to allow running alongside Bronze job
  driver:
    cores: 1
    coreLimit: "1000m"
    memory: "2g" # Reduced from 2g to fit in available memory
    memoryOverhead: "256m" # Reduced from 512m
    labels:
      version: 3.5.0
    serviceAccount: openhouse-spark-operator-spark
    env:
      # Set HOME to /tmp for writable ivy cache
      - name: HOME
        value: "/tmp"
      # Spark and Iceberg versions (used by Python code to build packages string)
      - name: SPARK_MINOR_VERSION
        value: "3.5"
      - name: ICEBERG_VERSION
        value: "1.5.2"
      # Bronze catalog configuration (for reading from Bronze warehouse)
      - name: BRONZE_CATALOG_URL
        value: "http://openhouse-lakekeeper:8181/catalog"
      - name: BRONZE_CLIENT_ID
        value: "spark"
      - name: BRONZE_CLIENT_SECRET
        value: "7PwnKrR0cRhh9PKaQRPRx2KGQBgmOUxa"
      - name: BRONZE_WAREHOUSE
        value: "bronze"
      # Silver catalog configuration (for writing to Silver warehouse)
      - name: SILVER_CATALOG_URL
        value: "http://openhouse-lakekeeper:8181/catalog"
      - name: SILVER_CLIENT_ID
        value: "spark"
      - name: SILVER_CLIENT_SECRET
        value: "7PwnKrR0cRhh9PKaQRPRx2KGQBgmOUxa"
      - name: SILVER_WAREHOUSE
        value: "silver"
      # Keycloak token endpoint (shared)
      - name: KEYCLOAK_TOKEN_ENDPOINT
        value: "http://openhouse-keycloak:80/realms/iceberg/protocol/openid-connect/token"
      # MinIO credentials (for Iceberg warehouse)
      - name: AWS_ACCESS_KEY_ID
        value: "admin"
      - name: AWS_SECRET_ACCESS_KEY
        value: "admin123"
      # Job configuration
      - name: FILTER_INVALID_RECORDS
        value: "false" # Set to "true" to filter out invalid records
      - name: DROP_EXISTING_TABLE
        value: "false" # Set to "true" to drop existing table before creating
        # Or use PVC: value: "/mnt/checkpoint" (mount PVC)
      - name: TRIGGER_INTERVAL
        value: "15 seconds" # Increased to ensure Bronze has committed (was 10s)
      - name: BRONZE_BUFFER_SECONDS
        value: "10" # Buffer time in seconds to subtract from timestamp (ensures Bronze has committed)

  # Executor configuration
  # Reduced resources to allow running alongside Bronze job
  # Minimal resources for streaming job with small batches
  executor:
    cores: 1
    instances: 2 # Minimum 1 executor for streaming (can't be 0)
    memory: "512m" # Minimal memory - further reduced from 1g
    memoryOverhead: "256m" # Minimal overhead
    labels:
      version: 3.5.0
    env:
      # Set HOME to /tmp for writable ivy cache
      - name: HOME
        value: "/tmp"
      # Spark and Iceberg versions (used by Python code to build packages string)
      - name: SPARK_MINOR_VERSION
        value: "3.5"
      - name: ICEBERG_VERSION
        value: "1.5.2"
      # Bronze catalog configuration (for reading from Bronze warehouse)
      - name: BRONZE_CATALOG_URL
        value: "http://openhouse-lakekeeper:8181/catalog"
      - name: BRONZE_CLIENT_ID
        value: "spark"
      - name: BRONZE_CLIENT_SECRET
        value: "7PwnKrR0cRhh9PKaQRPRx2KGQBgmOUxa"
      - name: BRONZE_WAREHOUSE
        value: "bronze"
      # Silver catalog configuration (for writing to Silver warehouse)
      - name: SILVER_CATALOG_URL
        value: "http://openhouse-lakekeeper:8181/catalog"
      - name: SILVER_CLIENT_ID
        value: "spark"
      - name: SILVER_CLIENT_SECRET
        value: "7PwnKrR0cRhh9PKaQRPRx2KGQBgmOUxa"
      - name: SILVER_WAREHOUSE
        value: "silver"
      # Keycloak token endpoint (shared)
      - name: KEYCLOAK_TOKEN_ENDPOINT
        value: "http://openhouse-keycloak:80/realms/iceberg/protocol/openid-connect/token"
      # MinIO credentials (for Iceberg warehouse)
      - name: AWS_ACCESS_KEY_ID
        value: "admin"
      - name: AWS_SECRET_ACCESS_KEY
        value: "admin123"
      # Job configuration
      - name: FILTER_INVALID_RECORDS
        value: "false"
      - name: DROP_EXISTING_TABLE
        value: "false"
      - name: TRIGGER_INTERVAL
        value: "15 seconds" # Increased to ensure Bronze has committed (was 10s)
      - name: BRONZE_BUFFER_SECONDS
        value: "10" # Buffer time in seconds to subtract from timestamp (ensures Bronze has committed)

  # Dependencies
  # Data files are included in the Docker image, no need to specify here
  deps: {}

  # Restart policy for streaming job
  restartPolicy:
    type: Always # Changed to Always for streaming job (should restart on failure)
    onFailureRetries: 2
    onFailureRetryInterval: 10
    onSubmissionFailureRetries: 3
    onSubmissionFailureRetryInterval: 20

  # Time to live after completion
  timeToLiveSeconds: 3600

  # Monitoring - disabled for now (JMX exporter not in image)
  # monitoring:
  #   exposeDriverMetrics: true
  #   exposeExecutorMetrics: true
  #   prometheus:
  #     jmxExporterJar: "/prometheus/jmx_prometheus_javaagent-0.16.1.jar"
  #     port: 8090
