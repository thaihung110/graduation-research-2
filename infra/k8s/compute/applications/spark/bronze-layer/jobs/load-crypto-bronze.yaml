apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: load-crypto-bronze
  namespace: default
  labels:
    app: load-crypto-bronze
    component: etl
    layer: bronze
spec:
  type: Python
  mode: cluster
  pythonVersion: "3"
  sparkVersion: "3.5.0"

  # Spark image with Python support and application code
  # Build and push using: cd spark-jobs/load-crypto-bronze && ./build-image.sh
  # Image is available at: https://hub.docker.com/r/hungvt0110/load-crypto-bronze
  image: hungvt0110/load-crypto-bronze:v0.3

  imagePullPolicy: Always

  # Main Python application file (inside the image)
  mainApplicationFile: local:///app/src/main.py

  # Arguments to pass to the Python script
  # Format: <kafka_topic> <database> <table_name>
  arguments:
    - "market-data.finnhub.crypto-trades.bronze" # Kafka topic
    - "bronze" # Database/warehouse name
    - "crypto_trades_raw" # Target table name

  # Spark configuration
  # Note: Most Iceberg/lakekeeper configs are set in Python code (load_crypto_bronze.py)
  # Only set configs here that must be set before SparkSession creation
  sparkConf:
    # JARs packages are now baked into the custom Docker image.
    # We no longer need spark.jars.packages or spark.jars.ivy here.

    # Kafka consumer config
    "spark.sql.streaming.kafka.useDeprecatedOffsetFetching": "false"

    # -------------------------------------------------------
    # Spark History Server - Event Log Configuration
    # Ghi event logs vào MinIO bucket riêng (dùng account logs)
    # -------------------------------------------------------
    "spark.eventLog.enabled": "true"
    # Trỏ về thư mục gốc event-logs (phải tồn tại sẵn trong MinIO)
    # Spark tự tạo file log với tên = applicationId bên trong thư mục này
    # KHÔNG dùng sub-directory per-job vì Spark yêu cầu path phải tồn tại trước
    "spark.eventLog.dir": "s3a://spark-logs/event-logs"
    "spark.eventLog.compress": "true"

    # -------------------------------------------------------
    # Credential Vending — Bước 3 (gravitino-credential-vending-minio.md)
    # -------------------------------------------------------
    # Yêu cầu Gravitino Iceberg REST vend S3 credentials thay vì dùng
    # credentials tĩnh trong hadoopConf.
    # Xác nhận bởi docs: "set spark.sql.catalog.rest.header.X-Iceberg-Access-Delegation
    #                      = vended-credentials in the client side"
    "spark.sql.catalog.lakekeeper.header.X-Iceberg-Access-Delegation": "vended-credentials"

    # MinIO FileIO configuration (PHẢI set thủ công — Bước 3)
    # Credential vending chỉ trả về access key + secret key.
    # Endpoint và path-style-access KHÔNG tự động chuyển từ server sang client.
    # Iceberg S3FileIO (không phải Hadoop S3A) cần các config này để kết nối MinIO.
    "spark.sql.catalog.lakekeeper.s3.endpoint": "http://openhouse-minio:9000"
    "spark.sql.catalog.lakekeeper.s3.path-style-access": "true"

  # Hadoop configuration for MinIO (S3-compatible)
  # Sử dụng 2 MinIO server khác nhau qua per-bucket configuration:
  #   - openhouse-minio:9000      -> bucket 'bronze' (Iceberg data)
  #   - openhouse-minio-log:9000  -> bucket 'spark-logs' (event logs)
  hadoopConf:
    # --- Global settings ---
    # Global endpoint trỏ tới minio-log (eventLog.dir dùng spark-logs bucket)
    # Per-bucket endpoint sẽ override cho từng bucket cụ thể
    "fs.s3a.endpoint": "http://openhouse-minio-log:9000"
    "fs.s3a.access.key": "admin"
    "fs.s3a.secret.key": "admin123"
    "fs.s3a.path.style.access": "true"
    "fs.s3a.connection.ssl.enabled": "false"
    "fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "fs.s3a.aws.credentials.provider": "org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider"
    # Disable S3Guard (tránh lỗi 'path must be absolute' khi S3Guard không có DynamoDB)
    "fs.s3a.metadatastore.impl": "org.apache.hadoop.fs.s3a.s3guard.NullMetadataStore"

    # -------------------------------------------------------
    # Per-bucket: DATA bucket (bronze) -> MinIO DATA server
    # -------------------------------------------------------
    # COMMENTED OUT — Bước 4 (gravitino-credential-vending-minio.md)
    # Iceberg S3FileIO nhận credentials từ Credential Vending (Gravitino).
    # Endpoint đã set ở spark.sql.catalog.lakekeeper.s3.endpoint (Bước 3).
    # Hadoop S3A không còn cần các config per-bucket bronze nữa.
    "fs.s3a.bucket.bronze.endpoint": "http://openhouse-minio:9000"
    # "fs.s3a.bucket.bronze.access.key": "admin"
    # "fs.s3a.bucket.bronze.secret.key": "admin123"

    # -------------------------------------------------------
    # Per-bucket: LOGS bucket (spark-logs) -> MinIO LOG server
    # -------------------------------------------------------
    "fs.s3a.bucket.spark-logs.endpoint": "http://openhouse-minio-log:9000"
    "fs.s3a.bucket.spark-logs.access.key": "admin"
    "fs.s3a.bucket.spark-logs.secret.key": "admin123"

  # Driver configuration
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "2g"
    memoryOverhead: "512m"
    labels:
      version: 3.5.0
    serviceAccount: openhouse-spark-operator-spark
    env:
      # Set HOME to /tmp for writable ivy cache
      - name: HOME
        value: "/tmp"
      # Spark and Iceberg versions (used by Python code to build packages string)
      - name: SPARK_MINOR_VERSION
        value: "3.5"
      - name: ICEBERG_VERSION
        value: "1.10.1"
      # Lakekeeper catalog configuration (matches defaults in load_crypto_bronze.py)
      - name: CATALOG_URL
        value: "http://openhouse-gravitino:9001/iceberg"
      - name: CLIENT_ID
        value: "spark"
      - name: CLIENT_SECRET
        value: "YeG2U2zPQqnLoIfD3Bc3c55pfIUnDNFd"
      - name: WAREHOUSE
        value: "bronze"
      - name: KEYCLOAK_TOKEN_ENDPOINT
        value: "http://openhouse-keycloak:80/realms/iceberg/protocol/openid-connect/token"
      # Kafka configuration
      - name: KAFKA_BOOTSTRAP_SERVERS
        value: "openhouse-kafka:9092"
      - name: KAFKA_TOPIC
        value: "market-data.finnhub.crypto-trades.bronze"
      - name: KAFKA_SASL_USERNAME
        value: "admin"
      - name: KAFKA_SASL_PASSWORD
        value: "admin"
      # MinIO credentials (fallback global)
      # Per-bucket credentials trong hadoopConf có ưu tiên cao hơn
      - name: AWS_ACCESS_KEY_ID
        value: "admin"
      - name: AWS_SECRET_ACCESS_KEY
        value: "admin123"
      - name: TRIGGER_INTERVAL
        value: "10 seconds"
      - name: CHECKPOINT_LOCATION
        value: "s3a://bronze/checkpoints/load-crypto-bronze"

  # Executor configuration
  # Reduced to allow Silver job to run alongside
  executor:
    cores: 2
    instances: 1 # Reduced from 2 to save memory for Silver job
    memory: "2g" # Reduced from 4g to save memory
    memoryOverhead: "512m" # Reduced from 1g
    labels:
      version: 3.5.0
    env:
      # Set HOME to /tmp for writable ivy cache
      - name: HOME
        value: "/tmp"
      # Spark and Iceberg versions (used by Python code to build packages string)
      - name: SPARK_MINOR_VERSION
        value: "3.5"
      - name: ICEBERG_VERSION
        value: "1.10.1"
      # Lakekeeper catalog configuration (matches defaults in load_crypto_bronze.py)
      - name: CATALOG_URL
        value: "http://openhouse-gravitino:9001/iceberg"
      - name: CLIENT_ID
        value: "spark"
      - name: CLIENT_SECRET
        value: "YeG2U2zPQqnLoIfD3Bc3c55pfIUnDNFd"
      - name: WAREHOUSE
        value: "bronze"
      - name: KEYCLOAK_TOKEN_ENDPOINT
        value: "http://openhouse-keycloak:80/realms/iceberg/protocol/openid-connect/token"
      # Kafka configuration
      - name: KAFKA_BOOTSTRAP_SERVERS
        value: "openhouse-kafka:9092"
      - name: KAFKA_TOPIC
        value: "market-data.finnhub.crypto-trades.bronze"
      - name: KAFKA_SASL_USERNAME
        value: "admin"
      - name: KAFKA_SASL_PASSWORD
        value: "admin"
      # MinIO credentials (fallback global)
      # Per-bucket credentials trong hadoopConf có ưu tiên cao hơn
      - name: AWS_ACCESS_KEY_ID
        value: "admin"
      - name: AWS_SECRET_ACCESS_KEY
        value: "admin123"
      - name: TRIGGER_INTERVAL
        value: "10 seconds"
      - name: CHECKPOINT_LOCATION
        value: "s3a://bronze/checkpoints/load-crypto-bronze"

  # Dependencies
  # Data files are included in the Docker image, no need to specify here
  deps: {}

  # Restart policy
  # CRITICAL CONFIGURATION for Streaming Job (Workaround for Iceberg Issue #12363)
  # Iceberg REST client < 1.9.0 does not correctly refresh tokens with Keycloak.
  # Strategy: Allow job to crash on token expiry and let K8s restart it to get a fresh token.
  # Ensure Keycloak token lifespan is set to ~1 hour to balance stability and restart frequency.
  restartPolicy:
    type: Always
    onFailureRetries: 1000 # Effectively infinite retries for long-running streaming
    onFailureRetryInterval: 10 # Wait 10s before restarting
    onSubmissionFailureRetries: 5
    onSubmissionFailureRetryInterval: 20

  # Time to live after completion
  timeToLiveSeconds: 3600

  # Monitoring - disabled for now (JMX exporter not in image)
  # monitoring:
  #   exposeDriverMetrics: true
  #   exposeExecutorMetrics: true
  #   prometheus:
  #     jmxExporterJar: "/prometheus/jmx_prometheus_javaagent-0.16.1.jar"
  #     port: 8090
